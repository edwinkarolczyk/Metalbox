name: Build Metalbox Portable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build portable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name Metalbox --collect-all PySide6 app.py

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Metalbox\* -DestinationPath Metalbox-0.0.1-portable.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metalbox-0.0.1-portable
          path: Metalbox-0.0.1-portable.zip
