name: Build packaged Metalbox Development

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packaged-development:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Read versions
        shell: pwsh
        run: |
          $appVersion = python -c "import app; print(app.APP_VERSION)"
          $launcherVersion = python -c "import launcher; print(launcher.LAUNCHER_VERSION)"
          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LAUNCHER_VERSION=$launcherVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Metalbox
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name Metalbox --collect-all PySide6 app.py

      - name: Build Launcher
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name MetalboxLauncher launcher.py

      - name: Create update manifest
        shell: pwsh
        run: |
          $sha = (Get-FileHash "dist\Metalbox.exe" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "dist\Metalbox.exe").Length
          $notes = git log -1 --pretty=%s
          $manifest = [ordered]@{
            schema = 1
            channel = "development-packaged"
            version = $env:APP_VERSION
            build = [int]$env:GITHUB_RUN_NUMBER
            commit = $env:GITHUB_SHA
            published_at = (Get-Date).ToUniversalTime().ToString("o")
            app_asset = "Metalbox.exe"
            app_sha256 = $sha
            app_size = $size
            launcher_asset = "MetalboxLauncher.exe"
            launcher_version = $env:LAUNCHER_VERSION
            notes = $notes
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 update.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metalbox-packaged-development-${{ github.run_number }}
          path: |
            dist\Metalbox.exe
            dist\MetalboxLauncher.exe
            update.json
