name: Check Metalbox source

on:
  push:
    branches: [ main ]
    paths:
      - app.py
      - dev_launcher.py
      - .github/workflows/check-source.yml
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile source
        run: |
          python -m py_compile app.py
          python -m py_compile dev_launcher.py
