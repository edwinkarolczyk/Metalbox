name: Check Metalbox source

on:
  push:
    branches: [ main ]
    paths:
      - app.py
      - dev_launcher.py
      - metalbox_core.py
      - tests/**
      - .github/workflows/check-source.yml
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source
        run: |
          python -m py_compile app.py
          python -m py_compile dev_launcher.py
          python -m py_compile metalbox_core.py

      - name: Core and UI smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -v
