name: Publish Metalbox Stable

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Opis zmian w tej wersji Stable"
        required: false
        default: "Wersja Stable Metalbox"

permissions:
  contents: write

jobs:
  stable-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Read versions
        shell: pwsh
        run: |
          $appVersion = python -c "import re; s=open('app.py',encoding='utf-8').read(); print(re.search(r'APP_VERSION\s*=\s*[\"\'']([^\"\'']+)',s).group(1))"
          $launcherVersion = python -c "import re; s=open('launcher.py',encoding='utf-8').read(); print(re.search(r'LAUNCHER_VERSION\s*=\s*[\"\'']([^\"\'']+)',s).group(1))"
          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LAUNCHER_VERSION=$launcherVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Metalbox
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name Metalbox --collect-all PySide6 app.py

      - name: Build Launcher
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name MetalboxLauncher launcher.py

      - name: Create update manifest
        shell: pwsh
        run: |
          $sha = (Get-FileHash "dist\Metalbox.exe" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "dist\Metalbox.exe").Length
          $manifest = [ordered]@{
            schema = 1
            channel = "stable"
            version = $env:APP_VERSION
            build = [int]$env:GITHUB_RUN_NUMBER
            commit = $env:GITHUB_SHA
            published_at = (Get-Date).ToUniversalTime().ToString("o")
            app_asset = "Metalbox.exe"
            app_sha256 = $sha
            app_size = $size
            launcher_asset = "MetalboxLauncher.exe"
            launcher_version = $env:LAUNCHER_VERSION
            notes = "${{ inputs.notes }}"
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 update.json

      - name: Publish Stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Stable release $tag already exists. Zmień APP_VERSION przed publikacją kolejnej wersji."
            exit 1
          }
          gh release create $tag `
            --target "$env:GITHUB_SHA" `
            --title "Metalbox $env:APP_VERSION" `
            --notes "${{ inputs.notes }}" `
            update.json `
            "dist\Metalbox.exe" `
            "dist\MetalboxLauncher.exe"
